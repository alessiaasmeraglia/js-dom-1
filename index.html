<!DOCTYPE html>
<html lang="it">
<head>
    <!-- Impostazioni base della pagina -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampadina intelligente</title>

    <!-- Collegamento al file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenitore principale -->
    <div class="container">
        <!-- Titolo -->
        <h1>Lampadina intelligente</h1>

        <!-- Messaggio di avviso -->
        <h3 id="warning" class="warning-mex">
            Attenzione! Non serve accendere la lampadina, rilevata luce sufficiente.
        </h3>

        <!-- Contenitore con immagine e bottone -->
        <div class="lamp-box">
            <!-- Immagine iniziale della lampadina spenta -->
            <img src="./img/white_lamp.png" alt="Lampadina spenta" class="lamp">

            <!-- Bottone per accendere e spegnere -->
            <button id="btn" class="lamp-btn">Accendi</button>
        </div>
    </div>

    <!-- Collegamento al file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
