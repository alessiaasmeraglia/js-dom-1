<!DOCTYPE html>
<html lang="it">
<head>
    <!-- Meta informazioni di base -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titolo della pagina -->
    <title>Lampadina intelligente</title>

    <!-- Collegamento al file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenitore principale della card -->
    <div class="container">

        <!-- Titolo -->
        <h1>Lampadina intelligente</h1>

        <!-- Messaggio di avviso mostrato da JavaScript -->
        <p id="warning" class="warning-mex">
            Attenzione! Non serve accendere la lampadina, rilevata luce sufficiente.
        </p>

        <!-- Sezione con lampadina, bottone e informazioni -->
        <div class="lamp-box">

            <!-- Immagine iniziale della lampadina spenta -->
            <img src="./img/white_lamp.png" alt="Lampadina spenta" class="lamp">

            <!-- Bottone per accendere e spegnere la lampadina -->
            <button id="btn" class="lamp-btn">Accendi</button>

            <!-- Stato attuale della lampadina -->
            <p id="status" class="status-text">Stato: OFF</p>

            <!-- Contatore del numero di accensioni -->
            <p id="counter" class="counter-text">Numero di accensioni: 0</p>
        </div>
    </div>

    <!-- Collegamento al file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
